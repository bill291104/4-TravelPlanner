<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🤖 네가 짜조 🏝️</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            display: flex; /* 전체 화면을 flex 컨테이너로 */
            justify-content: center; /* 가운데 정렬 */
            align-items: flex-start; /* 상단 정렬 */
            height: 100vh;
            padding-top: 20px; /* 상단 여백 추가 */
        }

        /* 👉 인트로 화면 정중앙 정렬 */
        .intro {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            position: absolute; /* 다른 콘텐츠와 겹치지 않게 */
            width: 100%;
            background-color: #f5f5f5;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
        }

        .start-btn {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #10a37f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .start-btn:hover {
            background-color: #0f8d6b;
        }

        /* 👉 메인 콘텐츠 영역 (채팅 + 계획) */
        .main-container {
            display: none; /* 처음엔 숨김 */
            flex-direction: row;
            width: 80%;
            max-width: 1200px;
            gap: 20px;
        }


        /* 👉 채팅 화면 */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 90vh; /* 화면 높이에 맞춤 */
            box-sizing: border-box;
            flex: 1; /* 남은 공간 차지 */
        }

        .chat-header {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            padding: 10px;
        }

        .chat-box {
            flex-grow: 1; /* 핵심: 이 요소가 남은 공간을 모두 차지하도록 함 */
            overflow-y: auto; /* 핵심: 내용이 넘치면 스크롤 생성 */
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 15px;
            background-color: white;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .chat-box div { /* 메시지 간격 */
            margin-bottom: 10px;
            max-width: 90%;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .input-area button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #10a37f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .input-area button:hover {
            background-color: #0f8d6b;
        }

        /* 👉 최종 계획 표시 영역 */
        .plan-container {
            display: none; /* 처음엔 숨김 */
            flex: 1; /* 남은 공간 차지 */
            height: 90vh;
            overflow-y: auto;
            background-color: white;
            border-radius: 10px;
            border: 1px solid #ccc;
            padding: 20px;
            box-sizing: border-box;
        }

        .plan-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: #10a37f;
        }

        .daily-plan {
            margin-bottom: 25px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        .daily-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .daily-description {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            padding-left: 5px;
            border-left: 3px solid #10a37f;
        }

        .event {
            margin-bottom: 15px;
            padding-left: 10px;
        }

        .event-time {
            font-weight: bold;
            font-size: 16px;
            color: #333;
        }
        .event-name {
            font-size: 16px;
            font-weight: bold;
        }

        .event-domain {
            font-size: 12px;
            background-color: #eee;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
        }

        .event-details {
            font-size: 14px;
            color: #555;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="intro" id="intro">
    <div class="logo">💬</div>
    <div class="title">네가 짜조 챗봇에 오신 걸 환영해요</div>
    <div class="subtitle">🔎 가고 싶은 여행지나 여행 플랜에 대해 물어보세요!</div>
    <button class="start-btn" onclick="startChat()">대화 시작하기 🖱️</button>
</div>

<div class="main-container" id="main-container">
    <div class="chat-container" id="chat-container">
        <div class="chat-header">🤖 네가 짜조 🏝️</div>
        <div id="chat-box" class="chat-box"></div>
        <div class="input-area" id="input-area">
            <input type="text" id="user-input" placeholder="메시지를 입력하세요" />
            <button onclick="sendMessage()">전송</button>
        </div>
    </div>

    <div class="plan-container" id="plan-container">
    </div>
</div>


<script>
    const travelRequestBody = {
        places: [],
        accommodations: [],
        restaurants: [],
        conversationHistory: []
    };

    function startChat() {
        document.getElementById("intro").style.display = "none";
        document.getElementById("main-container").style.display = "flex";

        const chatBox = document.getElementById("chat-box");
        addBotMessage("안녕하세요! 어디로 여행가고 싶으신가요?");

        travelRequestBody.conversationHistory.push({
            role: "assistant",
            content: "안녕하세요! 어디로 여행가고 싶으신가요?"
        });

        // Enter 키 이벤트 리스너 추가
        const input = document.getElementById("user-input");
        input.addEventListener("keydown", function(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
    }

    function addMessageToChat(text, sender) {
        const chatBox = document.getElementById("chat-box");
        const messageElement = document.createElement("div");
        messageElement.textContent = text;
        if (sender === 'bot-thinking') {
            messageElement.id = 'thinking-message';
        }
        chatBox.appendChild(messageElement);
        chatBox.scrollTop = chatBox.scrollHeight; // 항상 맨 아래로 스크롤
        return messageElement;
    }

    function addBotMessage(text) {
        return addMessageToChat(`🤖 여봇: ${text}`, 'bot');
    }

    function addUserMessage(text) {
        return addMessageToChat(`🙋‍♀️ 나: ${text}`, 'user');
    }

    function showThinking() {
        return addMessageToChat('🤖 여봇: 생각중...', 'bot-thinking');
    }

    function removeThinking() {
        const thinkingMessage = document.getElementById('thinking-message');
        if (thinkingMessage) {
            thinkingMessage.remove();
        }
    }

    function sendMessage() {
        const input = document.getElementById("user-input");
        const message = input.value.trim();
        if (message === "") return;

        addUserMessage(message);
        input.value = "";
        travelRequestBody.conversationHistory.push({ role: "user", content: message });

        const thinkingMessage = showThinking(); // '생각중...' 메시지 표시

        fetch("/answer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ context: message })
        })
            .then(res => {
                if (!res.ok) throw new Error("FastAPI /answer 연결 실패");
                return res.json();
            })
            .then(answerData => {
                thinkingMessage.remove(); // '생각중...' 메시지 제거
                const reply = answerData.reply || "알겠습니다. 여행 계획에 반영할게요!"; // ✅ 문구 수정
                addBotMessage(reply);
                travelRequestBody.conversationHistory.push({ role: "assistant", content: reply });

                // domain과 details 기반으로 travelRequestBody에 저장
                const domain = answerData.domain;
                const details = answerData.details || [];

                if (domain === "place") travelRequestBody.places = details;
                else if (domain === "restaurant") travelRequestBody.restaurants = details;
                else if (domain === "accom") travelRequestBody.accommodations = details;

                // answer 응답 포함된 전체 body로 check 전송
                const thinkingCheckMessage = showThinking(); // 다음 단계를 위해 다시 '생각중...' 표시
                return fetch("/check", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(travelRequestBody)
                }).finally(() => thinkingCheckMessage.remove()); // fetch가 끝나면 '생각중' 제거
            })
            .then(res => res.json())
            .then(checkData => {
                const reply = checkData.reply;
                const isFull = checkData.isFull;

                addBotMessage(reply);
                travelRequestBody.conversationHistory.push({ role: "assistant", content: reply });

                if (isFull) {
                    const planThinkingMessage = showThinking(); // '계획 생성중...' 표시
                    fetch("/plan", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(travelRequestBody)
                    })
                        .then(res => res.json())
                        .then(planData => {
                            planThinkingMessage.remove(); // '계획 생성중...' 제거
                            addBotMessage("여행 계획이 완성되었어요! 오른쪽에서 확인해보세요.");
                            displayFinalPlan(planData.final_plan);
                        })
                        .catch(err => {
                            planThinkingMessage.remove();
                            handleError(err, "계획 생성에 실패했어요.")
                        });
                }
            })
            .catch(err => {
                removeThinking(); // 오류 발생 시 '생각중...' 메시지 제거
                handleError(err, "서버 연결 오류로 답변을 불러오지 못했어요.");
            });
    }

    function displayFinalPlan(plan) {
        const planContainer = document.getElementById("plan-container");
        planContainer.style.display = "block"; // 계획 컨테이너 보이기
        planContainer.innerHTML = ''; // 이전 내용 초기화

        // 제목 추가
        const planTitle = document.createElement('div');
        planTitle.className = 'plan-title';
        planTitle.textContent = plan.plan_title || "나만의 여행 계획";
        planContainer.appendChild(planTitle);

        // 일자별 계획 추가
        plan.daily_plans.forEach(dailyPlan => {
            const dailyDiv = document.createElement('div');
            dailyDiv.className = 'daily-plan';

            const dailyHeader = document.createElement('div');
            dailyHeader.className = 'daily-header';
            dailyHeader.textContent = `Day ${dailyPlan.day} (${dailyPlan.date})`;
            dailyDiv.appendChild(dailyHeader);

            const dailyDesc = document.createElement('div');
            dailyDesc.className = 'daily-description';
            dailyDesc.textContent = dailyPlan.description;
            dailyDiv.appendChild(dailyDesc);

            dailyPlan.events.forEach(event => {
                const eventDiv = document.createElement('div');
                eventDiv.className = 'event';

                const eventHeaderDiv = document.createElement('div');

                const eventTime = document.createElement('span');
                eventTime.className = 'event-time';
                eventTime.textContent = event.time;
                eventHeaderDiv.appendChild(eventTime);

                const eventName = document.createElement('span');
                eventName.className = 'event-name';
                eventName.textContent = ` ${event.name}`;
                eventHeaderDiv.appendChild(eventName);

                const eventDomain = document.createElement('span');
                eventDomain.className = 'event-domain';
                eventDomain.textContent = event.domain;
                eventHeaderDiv.appendChild(eventDomain);

                eventDiv.appendChild(eventHeaderDiv);

                const eventDetails = document.createElement('div');
                eventDetails.className = 'event-details';
                eventDetails.innerHTML = `
                    ${event.description}<br>
                    <strong>주소:</strong> ${event.address || '정보 없음'}<br>
                    <strong>예상 비용:</strong> ${event.estimated_cost ? parseInt(event.estimated_cost).toLocaleString() + '원' : '정보 없음'}
                `;
                eventDiv.appendChild(eventDetails);

                dailyDiv.appendChild(eventDiv);
            });
            planContainer.appendChild(dailyDiv);
        });
    }

    function handleError(error, message) {
        console.error("❌ 오류 발생:", error);
        const errorMessage = message || "서버 연결 오류로 답변을 불러오지 못했어요.";
        addBotMessage(errorMessage);
        travelRequestBody.conversationHistory.push({ role: "assistant", content: errorMessage });
    }
</script>

</body>
</html>
