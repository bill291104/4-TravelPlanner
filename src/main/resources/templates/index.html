<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🤖 네가 짜조 🏝️</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
        }

        /* 👉 인트로 화면 정중앙 정렬 */
        .intro {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
        }

        .start-btn {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #10a37f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .start-btn:hover {
            background-color: #0f8d6b;
        }

        /* 👉 채팅 화면 */
        .chat-container {
            display: none; /* 처음엔 숨김 */
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            /* 👉 여기 추가 */
            width: 50%;         /* 너비를 화면의 50%로 */
            margin: 0 auto;     /* 수평 가운데 정렬 */
        }

        .chat-header {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .chat-box {
            height: 400px;
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 15px;
            background-color: white;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column; /* 아래에서 위로 쌓이게 */
            justify-content: flex-end; /* ✅ 하단 정렬 추가 */
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .input-area button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #10a37f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .input-area button:hover {
            background-color: #0f8d6b;
        }
    </style>
</head>
<body>

<!-- ✅ 인트로 화면 -->
<div class="intro" id="intro">
    <div class="logo">💬</div>
    <div class="title">네가 짜조 챗봇에 오신 걸 환영해요</div>
    <div class="subtitle">🔎 가고 싶은 여행지나 여행 플랜에 대해 물어보세요!</div>
    <button class="start-btn" onclick="startChat()">대화 시작하기 🖱️</button>
</div>

<!-- ✅ 채팅 화면 -->
<div class="chat-container" id="chat-container">
    <div class="chat-header">🤖 네가 짜조 🏝️</div>
    <div id="chat-box" class="chat-box"></div>
    <div class="input-area" id="input-area">
        <input type="text" id="user-input" placeholder="메시지를 입력하세요" />
        <button onclick="sendMessage()">전송</button>
    </div>
</div>

<script>
    // ✅ 전역 상태 통합 객체
    const travelRequestBody = {
        places: [],
        accommodations: [],
        restaurants: [],
        conversationHistory: []
    };

    function startChat() {
        document.getElementById("intro").style.display = "none";
        document.getElementById("chat-container").style.display = "flex";

        const chatBox = document.getElementById("chat-box");
        const botMessage = document.createElement("div");
        botMessage.textContent = "🤖 안녕하세요! 어디로 여행가고 싶으신가요?";
        chatBox.appendChild(botMessage);
        setTimeout(() => {
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 0);

        travelRequestBody.conversationHistory.push({
            role: "assistant",
            content: "안녕하세요! 어디로 여행가고 싶으신가요?"
        });

        fetch("/init")
            .then(res => res.json())
            .then(data => {
                const isEmpty = !data || Object.values(data).every(v => v === null || v === '');
                if (isEmpty) {
                    console.log("빈 객체입니다. 초기 안내창 또는 리셋 로직 실행!");
                } else {
                    console.log("데이터 있음. 화면에 표시 가능:", data);
                }

                document.getElementById("input-area").style.display = "block";
                document.querySelector(".start-btn").style.display = "none";

                const input = document.getElementById("user-input");
                if (!input.hasAttribute("data-listener-added")) {
                    input.setAttribute("data-listener-added", "true");
                    input.addEventListener("keydown", function(event) {
                        if (event.key === "Enter" && !event.shiftKey) {
                            event.preventDefault();
                            sendMessage();
                        }
                    });
                }
            })
            .catch(err => {
                console.error("초기화 실패", err);
            });
    }

    function sendMessage() {
        const input = document.getElementById("user-input");
        const message = input.value.trim();
        if (message === "") return;
        input.value = "";

        const chatBox = document.getElementById("chat-box");

        const userMessage = document.createElement("div");
        userMessage.textContent = "🙋‍♀️ 나: " + message;
        chatBox.appendChild(userMessage);
        chatBox.scrollTop = chatBox.scrollHeight;

        travelRequestBody.conversationHistory.push({ role: "user", content: message });

        fetch("/answer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ context: message })
        })
            .then(res => {
                if (!res.ok) throw new Error("FastAPI 연결 실패");
                return res.json();
            })
            .then(answerData => {
                const reply = answerData.reply || "🤖 응답을 처리하는 중이에요!";
                travelRequestBody.conversationHistory.push({ role: "assistant", content: reply });

                // ✅ domain과 details 기반으로 travelRequestBody에 저장
                const domain = answerData.domain;
                const details = answerData.details || [];

                if (domain === "place") {
                    travelRequestBody.places = details;
                } else if (domain === "restaurant") {
                    travelRequestBody.restaurants = details;
                } else if (domain === "accom") {
                    travelRequestBody.accommodations = details;
                }

                const botMessage = document.createElement("div");
                botMessage.textContent = "🤖 여봇: " + reply;
                chatBox.appendChild(botMessage);
                chatBox.scrollTop = chatBox.scrollHeight;

                // ✅ answer 응답 포함된 전체 body로 check 전송
                return fetch("/check", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(travelRequestBody)
                });
            })

                .then(res => res.json())
            // 1. /check 응답에서 reply 메시지 확인
            .then(checkData => {
                const reply = checkData.reply;
                const isFull = checkData.isFull; // ✅ boolean 확인

                const botMessage = document.createElement("div");
                botMessage.textContent = "🤖 여봇: " + reply;
                chatBox.appendChild(botMessage);
                chatBox.scrollTop = chatBox.scrollHeight;

                travelRequestBody.conversationHistory.push({ role: "assistant", content: reply });

                if (isFull) {
                    // 모든 도메인이 채워졌을 경우 /plan으로 이동
                    return fetch("/plan", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(travelRequestBody)
                    });
                } else {
                    // 도메인이 아직 비어있으면 추가 질문 유도
                    const followupMessage = document.createElement("div");
                    followupMessage.textContent = "🤖 여봇: 여행 준비를 위해 추가 정보가 필요해요! 더 알려주세요 ✨";
                    chatBox.appendChild(followupMessage);
                    chatBox.scrollTop = chatBox.scrollHeight;

                    travelRequestBody.conversationHistory.push({
                        role: "assistant",
                        content: "여행 준비를 위해 추가 정보가 필요해요! 더 알려주세요 ✨"
                    });
                }
            })
                .catch(err => {
                console.error("❌ 오류 발생:", err);
                const botMessage = document.createElement("div");
                botMessage.textContent = "🤖 여봇: 서버 연결 오류로 답변을 불러오지 못했어요.";
                chatBox.appendChild(botMessage);
                chatBox.scrollTop = chatBox.scrollHeight;

                travelRequestBody.conversationHistory.push({
                    role: "assistant",
                    content: "서버 연결 오류로 답변을 불러오지 못했어요."
                });
            });
    }
</script>
