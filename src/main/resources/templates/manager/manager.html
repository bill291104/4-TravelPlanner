<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이터 관리 페이지 (Demo)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 2rem; background-color: #f8f9fa; }
        .container-fluid { max-width: 1600px; }
        .table-responsive { max-height: 70vh; overflow-y: auto; }
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .table thead { position: sticky; top: 0; z-index: 2; }
        .form-control, .form-select { font-size: 0.9rem; }
        .pagination .page-link { font-size: 0.9rem; }
        .modal-dialog { max-width: 800px; }
        #loading-indicator {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 1056; display: none;
        }
    </style>
</head>
<body>

<div id="loading-indicator" class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
</div>

<div class="container-fluid">
    <h1 class="mb-4">데이터 관리 시스템</h1>

    <div class="card">
        <div class="card-body">
            <div class="action-bar">
                <div class="d-flex align-items-center gap-2">
                    <select id="domain-select" class="form-select" style="width: auto;">
                        <option value="place">장소 (Place)</option>
                        <option value="restaurant">식당 (Restaurant)</option>
                        <option value="accom">숙소 (Accommodation)</option>
                        <option value="place_review">장소 리뷰</option>
                        <option value="restaurant_review">식당 리뷰</option>
                        <option value="accom_review">숙소 리뷰</option>
                        <option value="travel_style">여행 스타일</option>
                    </select>
                    <input type="text" id="pk-input-sub" class="form-control" placeholder="메인 도메인 PK" style="width: 150px; display: none;">
                    <button id="fetch-btn" class="btn btn-primary">조회</button>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <button id="embed-btn" class="btn btn-info">선택 임베딩</button>
                    <button id="update-btn" class="btn btn-warning">선택 업데이트</button>
                    <button id="delete-btn" class="btn btn-danger">선택 삭제</button>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <button id="embed-all-btn" class="btn btn-outline-info">전체 임베딩</button>
                    <button id="update-all-btn" class="btn btn-outline-warning">전체 업데이트</button>
                    <button id="delete-all-btn" class="btn btn-outline-danger">전체 삭제</button>
                </div>
            </div>

            <div class="mb-3">
                <input type="text" id="search-filter-input" class="form-control" placeholder="조회된 결과 내에서 필터링...">
            </div>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover table-bordered">
                    <thead class="table-dark" id="data-table-head">
                    </thead>
                    <tbody id="data-table-body">
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer">
            <nav id="pagination-nav" aria-label="Page navigation">
            </nav>
        </div>
    </div>
</div>

<div class="modal fade" id="data-modal" tabindex="-1" aria-labelledby="modal-label" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-label">데이터 편집</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="data-form">
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                <button type="button" id="modal-save-btn" class="btn btn-primary">저장</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/manager.js"></script> </body>
</html>
